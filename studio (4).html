<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>3D Animation Studio</title>
<style>
:root{--bg:#10131a;--fg:#e8ecf4;--ac:#ff9f1c;--pn:#1c2230}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 14px;font-size:13px;background:linear-gradient(#000b,#0000);pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--pn);display:grid;gap:8px;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:center}
button,select{flex:1;min-height:52px;border:0;border-radius:12px;background:#2a3246;color:var(--fg);font:600 15px system-ui;min-width:0}
button.on{background:var(--ac);color:#111}
label{font-size:12px;flex:0 0 auto}
input[type=range]{flex:1;min-width:0}
#sheet,#sheet2{position:fixed;left:0;right:0;bottom:0;background:#141926;padding:12px 8px calc(env(safe-area-inset-bottom,0px) + 12px);display:none;gap:8px;z-index:5;border-radius:16px 16px 0 0}
#sheet.show,#sheet2.show{display:grid}
#list{font-size:12px;max-height:90px;overflow:auto}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:20px;font-size:13px;display:none;z-index:9;max-width:90%}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top"><b>3D Studio v3</b> · <span id="st">taiyaar</span></div>
<div id="toast"></div>
<div id="sheet">
 <div class="row"><button data-r="map">🗺 Map (.glb)</button><button data-r="char">🧍 Character (.glb)</button></div>
 <div class="row"><button data-r="prop">🚗 Gadi/Prop (.glb)</button><button data-r="clip">🏃 Clip (.glb/.fbx)</button></div>
 <div class="row"><button id="bFp">Files chooser: Auto (native)</button></div>
 <div id="list"></div>
 <div class="row"><button id="wipe">Saved sab hatao</button><button id="close">Band</button></div>
</div>
<div id="bar">
 <div class="row"><button id="bImp">📂 Import</button><button id="bPath" class="on">✏️ Path: ON</button><button id="bUndo">↩ Undo</button><button id="bClr">🗑 Saaf</button><button id="bMore">⋯</button></div>
 <div class="row"><input id="prm" placeholder="Likho: chalte hue aao, phir gadi mein baitho" style="flex:1;min-width:0;height:48px;border-radius:12px;border:0;padding:0 12px;background:#2a3246;color:#e8ecf4;font-size:15px"><button id="bGo" style="flex:0 0 74px">🎬</button></div>
 <div class="row"><select id="clipSel"></select><button id="bPlay">▶ Chalo</button></div>
 <div class="row"><label>Speed</label><input id="spd" type="range" min="0.3" max="8" step="0.1" value="1.3"><label id="spdv">1.3</label><label>Map</label><input id="msz" type="range" min="-2" max="1" step="0.05" value="0"></div>

</div>

 const p=M.tx(I.w[i],[c&1?pm.max[0]:pm.min[0],c&2?pm.max[1]:pm.min[1],c&4?pm.max[2]:pm.min[2]]);for(let k=0;k<3;k++){mn[k]=Math.min(mn[k],p[k]);mx[k]=Math.max(mx[k],p[k])}}});return{min:mn,max:mx}}
async function addAsset(r,name,buf,save){
 if(!r)return toast('Pehle role chuno (Map/Character/Clip)');
 const A=await loadGLB(buf);
 if(r==='map'){S.mapA=A;S.map=inst(A);S.mapB=mapBounds(S.map);S.mapScale=1;$('msz').value=0;
  const ext=Math.max(S.mapB.max[0]-S.mapB.min[0],S.mapB.max[2]-S.mapB.min[2]);if(ext>200){S.mapScale=Math.pow(10,-Math.round(Math.log10(ext/20)));$('msz').value=Math.log10(S.mapScale)}
  setMapB();S.pts=[];setPath();toast(`Map ready: ${A.meshes.reduce((a,m)=>a+m.length,0)} meshes`)}
 else if(r==='char'){const I=inst(A);upd(I);let mn=1e9,mx=-1e9;A.nodes.forEach((n,i)=>{if(A.skins.length&&!A.skins[0].j.includes(i))return;mn=Math.min(mn,I.w[i][13]);mx=Math.max(mx,I.w[i][13])});
  if(!(mx>mn)){mn=0;mx=1}A.H=mx-mn;S.charA=A;S.char=I;S.charSc=1.75/A.H;S.gOff=-mn;rest(I);S.clips.forEach(c=>delete c.sp);startPose();toast('Character ready')}
 else if(r==='clip'){if(!A.anims.length)throw new Error('is file mein animation nahi');A.anims.forEach(a=>S.clips.push({name:name.replace(/\.glb$/i,'')+(A.anims.length>1?':'+a.name:''),an:a}));fillClips();toast(A.anims.length+' clip add hui')}
 else if(r==='prop'){const I=inst(A),b=mapBounds(I),ex=Math.max(b.max[0]-b.min[0],b.max[2]-b.min[2])||1;S.props=[{name,A,I,k:4.2/ex,cx:(b.min[0]+b.max[0])/2,cz:(b.min[2]+b.max[2])/2,minY:b.min[1]}];toast('Gadi/Prop lag gayi')}
 if(save){if(r==='map'||r==='char'){const all=await dbAll()||[];for(const x of all)if(x.role===r)await dbx('readwrite',s=>s.delete(x.id))}await dbx('readwrite',s=>s.add({role:r,name,buf}))}}
async function listSaved(){const a=await dbAll()||[];$('list').textContent=a.length?'Saved: '+a.map(x=>x.role+':'+x.name).join(' · '):'Kuch saved nahi'}
$('wipe').onclick=async()=>{await dbx('readwrite',s=>s.clear());listSaved();toast('Saved hata diya (ab reload par wapas nahi aayega)')};
(async()=>{const a=await dbAll()||[];for(const x of a.sort((p,q)=>p.id-q.id))try{await addAsset(x.role,x.name,x.buf,false)}catch(e){}ui()})();

/* ---------- Phase 2-4: timeline, gadi, camera, prompt, record ---------- */
const posOn=(pi,s)=>{const o=S.pi;S.pi=pi;const r=posAt(s);S.pi=o;return r};
function setRot(I,n,a){const i=I.A.byName[n];if(i!=null)I.r[i]=[Math.sin(a/2),0,0,Math.cos(a/2)]}
function seatPose(I){setRot(I,'leftupleg',-1.5);setRot(I,'rightupleg',-1.5);setRot(I,'leftleg',1.5);setRot(I,'rightleg',1.5);const h=I.A.byName.hips;if(h!=null)I.t[h]=[I.t[h][0],I.A.nodes[h].t[1]*.58,I.t[h][2]]}
function drawCar(){const p=S.carPos;if(!p)return;const pr=S.props&&S.props[0],base=M.trs([p[0],S.pickY,p[1]],qY(S.carYaw||0),[1,1,1]);
 if(pr){const k=pr.k;gl.uniform1i(U.uMode,0);drawInst(pr.I,M.mul(base,M.trs([-pr.cx*k,-pr.minY*k,-pr.cz*k],[0,0,0,1],[k,k,k])),null);return}
 const part=(o,sz,c)=>solid(M.mul(base,M.trs(o,[0,0,0,1],sz)),c,0);
 part([0,.45,0],[1.8,.5,3.8],[.8,.15,.12,1]);part([0,.85,1.5],[1.6,.2,.9],[.75,.13,.1,1]);part([0,1,.75],[1.6,.5,.08],[.3,.45,.6,1]);part([0,.76,-.25],[.9,.1,.9],[.15,.15,.18,1]);
 for(const x of[-.95,.95])for(const z of[-1.2,1.3])part([x,.32,z],[.25,.64,.64],[.08,.08,.08,1])}
function resetTL(){S.ti=0;S.en=0;S.seated=false;S.jy=0;S.t=0;S.carPos=S.carHome?S.carHome.slice():null;S.carYaw=S.carHomeYaw||0;rest(S.char);
 const P=S.paths[0];if(P.L>0){S.cur=posOn(0,0);const q=posOn(0,.6);S.yaw=Math.atan2(q[0]-S.cur[0],q[1]-S.cur[1])}}
function endTL(){S.play=false;if(!S.seated)rest(S.char);stopRec();ui()}
function runTL(dt,spd){const st=S.tl[S.ti];if(!st)return endTL();const k=spd/1.3,I=S.char,P=S.paths[st.p||0];
 if(!S.en){S.en=1;S.tt=0;S.ts=0;S.y0=S.yaw;S.sf=S.cur.slice();
  if(st.a==='drive'){S.carPos=posOn(st.p,P.L*st.f0);const q=posOn(st.p,P.L*st.f0+.6);S.carYaw=Math.atan2(q[0]-S.carPos[0],q[1]-S.carPos[1])}}
 S.tt+=dt;rest(I);let done=false;
 switch(st.a){
 case'walk':case'run':{const v=(st.a==='run'?4:1.3)*k,Lr=P.L*(st.f1-st.f0);S.ts+=v*dt;const s=P.L*st.f0+Math.min(S.ts,Lr),p=posOn(st.p,s),q=posOn(st.p,s+Math.max(.35,v*.25));S.cur=p;
  if(Math.hypot(q[0]-p[0],q[1]-p[1])>1e-3)S.yaw+=angD(S.yaw,Math.atan2(q[0]-p[0],q[1]-p[1]))*Math.min(1,dt*7);
  const c=pickClip(v),cs=clipSpeed(c);S.t+=dt*v/cs;applyAnim(I,c.an,S.t);S.clipN=c.name;done=S.ts>=Lr;break}
 case'stop':done=S.tt>=st.t;break;
 case'sit_free':seatPose(I);done=S.tt>=st.t;break;
 case'turn':{const u=Math.min(1,S.tt/.6);S.yaw=S.y0+st.ang*u;done=u>=1;break}
 case'jump':{const u=Math.min(1,S.tt/.9),h=Math.sin(Math.PI*u);setRot(I,'leftupleg',-.9*(1-h*.3));setRot(I,'rightupleg',-.9*(1-h*.3));setRot(I,'leftleg',1.2*(1-h));setRot(I,'rightleg',1.2*(1-h));S.jy=h*.7;done=u>=1;break}
 case'throw':{const u=Math.min(1,S.tt/.9);setRot(I,'rightarm',-2.6*Math.sin(Math.PI*u));setRot(I,'rightforearm',-.3);done=u>=1;break}
 case'sit':{const u=Math.min(1,S.tt/1),c=S.carPos||S.sf;S.cur=[S.sf[0]+(c[0]-S.sf[0])*u,S.sf[1]+(c[1]-S.sf[1])*u];S.yaw+=angD(S.yaw,S.carYaw||S.yaw)*Math.min(1,dt*6);if(u>.4)seatPose(I);if(u>=1){S.seated=true;done=true}break}
 case'drive':{const v=5*k,Lr=P.L*(st.f1-st.f0);S.ts+=v*dt;const s=P.L*st.f0+Math.min(S.ts,Lr),p=posOn(st.p,s),q=posOn(st.p,s+Math.max(1,v*.4));S.carPos=p;
  if(Math.hypot(q[0]-p[0],q[1]-p[1])>1e-3)S.carYaw+=angD(S.carYaw,Math.atan2(q[0]-p[0],q[1]-p[1]))*Math.min(1,dt*5);
  S.cur=p;S.yaw=S.carYaw;S.seated=true;done=S.ts>=Lr;break}}
 if(S.seated)seatPose(I);
 if(done){S.ti++;S.en=0;S.jy=0;if(S.ti>=S.tl.length)endTL()}}
function camUpdate(dt){const m=S.camMode;if(m==='free'||!S.cur)return;const c=S.cam,seat=S.seated&&S.carPos,f=seat?S.carPos:S.cur,h=seat?S.carYaw:S.yaw,k=Math.min(1,dt*4);
 c.tg[0]+=(f[0]-c.tg[0])*k;c.tg[1]=S.pickY+1;c.tg[2]+=(f[1]-c.tg[2])*k;let ty=c.yaw,tp=.3,td=6;
 if(m==='follow'){ty=h+Math.PI}else if(m==='top'){tp=1.45;td=14}else if(m==='side'){ty=h+Math.PI/2;tp=.25;td=7}else if(m==='front'){ty=h;tp=.2;td=5}else if(m==='orbit'){ty=c.yaw+.5;tp=.4;td=8}
 c.yaw+=angD(c.yaw,ty)*(m==='orbit'?dt:k);c.pitch+=(tp-c.pitch)*k;c.dist+=(td-c.dist)*k}
const LBL={walk:'chalna',run:'bhaagna',stop:'rukna',turn:'mudna',sit:'gadi mein baithna',sit_free:'baithna',drive:'gadi chalana',jump:'kudna',throw:'phenkna'};
function showTL(){$('tl').textContent=S.tl.length?S.tl.map((s,i)=>`${i+1}. ${LBL[s.a]}${s.p!=null?' (Path '+(s.p+1)+')':''}`).join('\n'):'Timeline khali hai. Prompt box mein likho.'}
function parseTL(txt){const t=txt.toLowerCase().replace(/[.!?]/g,' '),steps=[],unk=[],num=c=>+(c.match(/(\d+)\s*(?:sec|second)/)?.[1]||2);
 const cl=t.split(/\s+(?:aur|phir|fir|uske baad|uske bad|then|and)\s+|,|;|\s+aage\s+/).map(x=>x.trim()).filter(Boolean);
 for(const c of cl){const car=/gadi|gaadi|car|jeep/.test(c);let s=null;
  if(car&&/baith|bait|sit/.test(c))s={a:'sit'};else if(car&&/chal|drive|bhaag/.test(c))s={a:'drive'};
  else if(/baith|bait|sit/.test(c))s={a:'sit_free',t:num(c)};else if(/kud|jump/.test(c))s={a:'jump'};else if(/phenk|fenk|throw/.test(c))s={a:'throw'};
  else if(/\bmud|ghum|turn/.test(c))s={a:'turn',ang:(/baay|left|ulta/.test(c)?1:-1)*Math.PI/2};else if(/ruk|stop|khad|thehar|wait/.test(c))s={a:'stop',t:num(c)};
  else if(/bhaag|daud|run/.test(c))s={a:'run'};else if(/chal|\baa|walk|\bja|pahunch/.test(c))s={a:'walk'};
  s?steps.push(s):unk.push(c)}
 const mv=x=>['walk','run','drive'].includes(x.a),need=steps.filter(mv);need.forEach(x=>x.p=(x.a==='drive'&&S.paths[1].L>0)?1:0);
 for(const x of need)if(!(S.paths[x.p].L>0))return{err:'Pehle map pe Path '+(x.p+1)+' banao (kam se kam 2 point)'};
 [0,1].forEach(p=>{const m=need.filter(x=>x.p===p);m.forEach((x,i)=>{x.f0=i/m.length;x.f1=(i+1)/m.length})});
 if(steps.some(x=>x.a==='sit'||x.a==='drive')){const d=steps.find(x=>x.a==='drive');
  if(d&&d.p===1){S.carHome=posOn(1,0);const q=posOn(1,.6);S.carHomeYaw=Math.atan2(q[0]-S.carHome[0],q[1]-S.carHome[1])}
  else if(S.paths[0].L>0){const L=S.paths[0].L,e=posOn(0,L),q=posOn(0,L-.5),h=Math.atan2(e[0]-q[0],e[1]-q[1]);S.carHome=[e[0]+Math.cos(h)*1.8,e[1]-Math.sin(h)*1.8];S.carHomeYaw=h}}
 else S.carHome=null;
 return{steps,unk}}
$('bGo').onclick=()=>{const r=parseTL($('prm').value);if(r.err)return toast(r.err);if(!r.steps.length)return toast('Samajh nahi aaya. Likho: chalte hue aao, phir gadi mein baitho');
 S.tl=r.steps;showTL();resetTL();S.play=false;ui();toast(r.steps.length+' step bane'+(r.unk.length?' · nahi samjha: '+r.unk.join(', '):''))};
$('bMore').onclick=()=>$('sheet2').classList.add('show');$('bClose2').onclick=()=>$('sheet2').classList.remove('show');
$('bTlc').onclick=()=>{S.tl=[];S.carHome=null;S.carPos=null;S.seated=false;S.play=false;rest(S.char);showTL();ui()};
$('camSel').onchange=()=>S.camMode=$('camSel').value;
let rec=null,chunks=[];
function recStart(){try{const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
 rec=new MediaRecorder(cv.captureStream(30),{mimeType:mt,videoBitsPerSecond:6e6});chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=()=>saveBlob(new Blob(chunks,{type:mt}),'animation.'+(mt.includes('mp4')?'mp4':'webm'));rec.start(500);toast('Recording shuru')}catch(e){rec=null;toast('Record support nahi: '+e.message)}}
function stopRec(){if(rec&&rec.state!=='inactive'){rec.stop();rec=null}}
async function saveBlob(b,name){S.lastSave={name,size:b.size};
 try{const P=window.Capacitor&&window.Capacitor.Plugins;if(P&&P.Filesystem&&P.Share){const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(b)});
  const w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:name,url:w.uri});return}}catch(e){toast('Share fail: '+(e.message||e))}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1500);toast(name+' save hua')}
$('bRec').onclick=()=>{if(!S.tl.length)return toast('Pehle prompt se timeline banao');$('sheet2').classList.remove('show');recStart();resetTL();S.play=true;ui()};
$('bSave').onclick=()=>saveBlob(new Blob([JSON.stringify({v:1,paths:S.paths.map(p=>p.pts),tl:S.tl,carHome:S.carHome,carHomeYaw:S.carHomeYaw,spd:+$('spd').value,cam:S.camMode,prm:$('prm').value})],{type:'application/json'}),'project.json');
$('bLoad').onclick=()=>{$('fj').value='';$('fj').click()};
$('fj').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());S.paths.forEach((P,i)=>{P.pts=j.paths[i]||[]});const o=S.pi;S.paths.forEach((_,i)=>{S.pi=i;rebuild()});S.pi=o;
 S.tl=j.tl||[];S.carHome=j.carHome||null;S.carHomeYaw=j.carHomeYaw||0;$('spd').value=j.spd||1.3;$('prm').value=j.prm||'';S.camMode=j.cam||'free';$('camSel').value=S.camMode;showTL();resetTL();ui();toast('Project load hua')}catch(err){toast('Project file galat hai')}};
/* ---------- loop ---------- */
let last=performance.now();resize();ui();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();if(S.play)ui();if(window.app.onFrame)window.app.onFrame(dt);requestAnimationFrame(frame)}
window.app={S,posOn,addAsset,tapAt:tap,setPts(p){S.pts=p;setPath()},play:()=>$('bPlay').click(),
 foot(){const I=S.char,sc=S.charSc,cm=M.trs([S.cur[0],S.pickY+S.gOff*sc,S.cur[1]],qY(S.yaw),[sc,sc,sc]);return['leftfoot','rightfoot'].map(n=>M.tx(cm,[I.w[I.A.byName[n]][12],I.w[I.A.byName[n]][13],I.w[I.A.byName[n]][14]]))},
 clipSpeed:()=>S.clips.map(c=>[c.name,clipSpeed(c)]),
 dump(ci,N=12){const I=S.char,an=S.clips[ci].an,o=[];rest(I);for(let i=0;i<N;i++){applyAnim(I,an,i/N*an.dur);upd(I);o.push(['leftfoot','rightfoot'].map(n=>{const w=I.w[I.A.byName[n]];return[+w[13].toFixed(3),+w[14].toFixed(3)]}))}rest(I);return o}};
requestAnimationFrame(frame);
